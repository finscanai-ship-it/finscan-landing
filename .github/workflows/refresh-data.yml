name: Refresh market data

# Monthly: 1st of each month at 22:30 UTC (~30 min after US market close).
# Landing prices are intentionally a fixed monthly snapshot, not a daily feed.
# Also run on push to main (for fast iteration when the script changes).
on:
  schedule:
    - cron: '30 22 1 * *'   # 1st of the month, after NYSE close
  workflow_dispatch: {}        # allow manual "run" from GitHub UI

# Tokens needed to push the commit back to the repo
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance

      - name: Refresh market_data.json
        run: python scripts/refresh_market_data.py

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain market_data.json)" ]; then
            git config user.name  "finscan-bot"
            git config user.email "noreply@getfinscan.com"
            git add market_data.json
            git commit -m "data: refresh market_data.json [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
